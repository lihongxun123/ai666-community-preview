<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参赛作品 - AIGC 创作挑战赛</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/duoyuan-shiguang-favicon.svg">
  <link rel="stylesheet" href="./style.css?v=20260805-c02b">
  <link rel="stylesheet" href="./competition.css?v=20260813-submit-modal">
  <link rel="stylesheet" href="./competition-state-gates.css?v=20260814-state-matrix">
</head>
<body>
<div class="competition-page" data-page="competition-works" data-competition-id="COMP-2026-AIGC-01" data-auth-default="user">
  <header class="competition-header">
    <div class="competition-header-inner">
      <a class="competition-platform-brand" href="./index.html" aria-label="返回多元拾光社区"><img src="assets/brand/duoyuan-shiguang-logo-mark-reverse.svg" alt=""><strong>多元拾光</strong></a>
      <a class="competition-brand" href="./competition-detail.html" data-competition-brand-lockup data-competition-link aria-label="AIGC 创作挑战赛活动介绍"><span class="competition-brand-copy"><strong data-competition-event-name>AIGC 创作挑战赛</strong></span></a>
      <nav class="competition-site-nav" aria-label="赛事导航"><a href="./competition-detail.html" data-competition-link>活动介绍</a><a href="./competition-rules.html" data-competition-link>参赛规则</a><a href="./competition-ranking.html" data-competition-link class="is-active" aria-current="page">参赛作品</a><a href="./competition-my-submissions.html" data-competition-link>我的投稿</a></nav>
      <div class="competition-header-right"><button class="competition-auth competition-auth--guest" type="button" data-competition-login-open>登录</button><div class="competition-auth competition-auth--logged" aria-label="当前登录用户"><img src="assets/image_assets/1.png" alt=""><span data-auth-name title="空镜">空镜</span></div></div>
    </div>
  </header>

  <main class="competition-page-shell competition-subpage">
    <section class="competition-event-notice" data-event-banner hidden role="status"></section>
    <header class="competition-content-header" aria-label="参赛作品" data-competition-content-navigation data-primary-view="all">
      <div class="competition-content-heading"><span>参赛作品</span><strong>全部作品</strong></div>
      <a href="./competition-ranking.html" data-competition-link data-competition-content-view="ranking">查看排行榜 <img src="resources/icons/remixicon/svg/Arrows/arrow-right-line.svg" alt=""></a>
    </header>
    <section class="competition-works-toolbar" aria-label="作品筛选">
      <label><span class="sr-only">赛道</span><select data-work-track><option value="all">全部赛道</option><option value="short">8–30s</option><option value="medium">30–90s</option><option value="long">90s+</option><option value="free">自由创作</option></select></label>
      <label><span class="sr-only">排序</span><select data-work-sort><option value="heat">热度优先</option><option value="new">最新发布</option></select></label>
      <label class="competition-search"><img src="resources/icons/remixicon/svg/System/search-line.svg" alt=""><input type="search" aria-label="搜索作品或创作者" placeholder="搜索作品或创作者" data-work-search></label>
    </section>

    <section class="competition-works-section" aria-live="polite">
      <div class="competition-list-meta"><strong data-works-count>0 个作品</strong></div>
      <div class="competition-loading" data-works-loading hidden><span></span><p>作品正在赶来</p></div>
      <div class="competition-empty" data-works-empty hidden><img src="resources/icons/remixicon/svg/Media/video-line.svg" alt=""><h2>还没有符合条件的作品</h2><p>换个赛道或关键词再看看。</p><button class="competition-btn secondary" type="button" data-works-reset>清除筛选</button></div>
      <div class="competition-empty" data-works-error hidden><img src="resources/icons/remixicon/svg/System/error-warning-line.svg" alt=""><h2>作品加载失败</h2><p>网络开了个小差，请稍后重试。</p><button class="competition-btn secondary" type="button" data-works-retry>重新加载</button></div>
      <div class="competition-works-grid" data-works-list></div>
    </section>
  </main>

  <section class="case-detail-modal content-format-modal competition-work-detail-modal" data-competition-modal="work-detail" data-competition-work-detail-modal hidden aria-label="作品详情弹层">
    <div data-competition-work-detail-host data-detail-surface="modal"></div>
    <div class="modal-backdrop" data-competition-modal-close aria-hidden="true"></div>
  </section>
</div>
<script src="./walkthrough.js?v=20260805-c02b"></script><script src="./competition.js?v=20260814-work-return"></script>
<script src="./competition-state-gates.js?v=20260814-state-matrix"></script>
</body>
</html>
