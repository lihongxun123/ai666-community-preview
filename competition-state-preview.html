<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>赛事运营预览台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06080b;
      --panel: #0d1117;
      --panel-2: #121821;
      --line: rgba(255,255,255,.1);
      --line-strong: rgba(255,255,255,.18);
      --text: #f3efe5;
      --muted: #969da8;
      --gold: #f4c95d;
      --gold-soft: rgba(244,201,93,.12);
      --green: #62d89b;
      --radius: 18px;
      font-family: "HarmonyOS Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body {
      background:
        radial-gradient(circle at 76% 2%, rgba(244,201,93,.08), transparent 28%),
        linear-gradient(180deg, #090c11 0, #06080b 62%);
    }
    button, a { font: inherit; }
    button { color: inherit; }
    .ops-shell { height: 100vh; min-height: 100vh; padding: 12px; overflow: hidden; }
    .ops-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(11,15,21,.88);
      backdrop-filter: blur(18px);
    }
    .ops-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ops-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 10px;
      color: #090b0e;
      background: var(--gold);
      font-weight: 900;
    }
    .ops-brand strong { display: block; font-size: 17px; letter-spacing: .02em; }
    .ops-brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .ops-header-actions { display: flex; align-items: center; gap: 8px; }
    .ops-button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      background: transparent;
      cursor: pointer;
    }
    .ops-button:hover, .ops-button:focus-visible { border-color: rgba(244,201,93,.55); outline: none; }
    .ops-button.primary { border-color: var(--gold); color: #111318; background: var(--gold); font-weight: 800; }
    .ops-layout {
      display: grid;
      grid-template-columns: 218px minmax(0,1fr);
      gap: 12px;
      height: 100%;
      margin-top: 0;
    }
    .ops-sidebar, .ops-main {
      min-height: 0;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(10,14,19,.9);
    }
    .ops-sidebar { padding: 18px 14px; }
    .ops-sidebar h2 { margin: 0 8px 14px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .phase-list { display: grid; gap: 7px; }
    .phase-button {
      position: relative;
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 54px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      text-align: left;
      background: transparent;
      cursor: pointer;
    }
    .phase-button:hover { background: rgba(255,255,255,.035); }
    .phase-button.is-active { border-color: rgba(244,201,93,.38); background: var(--gold-soft); }
    .phase-index {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      font-size: 11px;
    }
    .phase-button.is-active .phase-index { border-color: var(--gold); color: var(--gold); }
    .phase-copy strong { display: block; font-size: 14px; }
    .phase-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .ops-main { display: flex; min-width: 0; padding: 12px; flex-direction: column; }
    .scenario-head { display: none; align-items: flex-end; justify-content: space-between; gap: 20px; }
    .scenario-head h1 { margin: 0; font-size: clamp(22px,2.6vw,34px); }
    .scenario-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .valid-badge { flex: 0 0 auto; color: var(--green); font-size: 12px; }
    .valid-badge::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; }
    .scenario-list {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
      margin-top: 0;
      padding-bottom: 4px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .scenario-button {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #c7cbd1;
      background: #0a0e13;
      cursor: pointer;
    }
    .scenario-button:hover { border-color: var(--line-strong); }
    .scenario-button.is-active { border-color: var(--gold); color: #14161a; background: var(--gold); font-weight: 800; }
    .expectation-grid {
      display: none;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .expectation-item {
      min-width: 0;
      min-height: 74px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    .expectation-item span { display: block; color: var(--muted); font-size: 11px; }
    .expectation-item strong { display: block; margin-top: 7px; font-size: 13px; line-height: 1.55; }
    .preview-panel {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 8px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 15px;
      background: #030508;
    }
    .preview-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 7px 10px 7px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }
    .page-tabs { display: flex; gap: 3px; min-width: 0; overflow-x: auto; }
    .page-tab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 11px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .page-tab.is-active { color: var(--text); background: rgba(255,255,255,.08); }
    .preview-meta { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
    .preview-meta span { color: var(--muted); font-size: 11px; }
    .open-page { color: var(--gold); text-decoration: none; font-size: 12px; }
    .preview-frame { display: block; width: 100%; height: 100%; min-height: 0; border: 0; background: #05070a; }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      padding: 11px 14px;
      border: 1px solid rgba(98,216,155,.38);
      border-radius: 10px;
      color: #c8f4dd;
      background: #10231b;
      opacity: 0;
      transform: translateY(8px);
      transition: .2s ease;
      pointer-events: none;
    }
    .toast.is-visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 960px) {
      .ops-shell { height: auto; overflow: visible; }
      .ops-layout { grid-template-columns: 1fr; }
      .ops-sidebar { height: auto; padding: 12px; }
      .ops-main { height: 72vh; min-height: 620px; }
      .phase-list { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .phase-button { grid-template-columns: 24px 1fr; }
      .phase-index { width: 24px; height: 24px; }
      .preview-frame { height: 100%; }
    }
    @media (max-width: 680px) {
      .ops-shell { padding: 8px; }
      .ops-header { align-items: flex-start; padding: 12px; }
      .ops-brand span, .ops-header-actions .secondary-action { display: none; }
      .phase-list { display: flex; overflow-x: auto; }
      .phase-button { flex: 0 0 150px; }
      .expectation-grid { grid-template-columns: 1fr; }
      .scenario-head { align-items: flex-start; flex-direction: column; gap: 6px; }
      .preview-toolbar { align-items: flex-start; flex-direction: column; }
      .preview-meta { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="ops-shell">
    <header class="ops-header">
      <div class="ops-brand">
        <span class="ops-mark">赛</span>
        <div><strong>赛事运营预览台</strong><span>按阶段检查用户看到的页面与可执行动作</span></div>
      </div>
      <div class="ops-header-actions">
        <button class="ops-button secondary-action" type="button" data-refresh>刷新预览</button>
        <button class="ops-button primary" type="button" data-copy>复制当前场景</button>
      </div>
    </header>

    <div class="ops-layout">
      <aside class="ops-sidebar">
        <h2>赛事生命周期</h2>
        <nav class="phase-list" aria-label="赛事生命周期" data-phase-list></nav>
      </aside>

      <main class="ops-main">
        <section class="scenario-head">
          <div><h1 data-scenario-title></h1><p data-scenario-description></p></div>
          <span class="valid-badge">运营确认场景</span>
        </section>
        <div class="scenario-list" role="tablist" aria-label="用户场景" data-scenario-list></div>

        <section class="expectation-grid" aria-label="场景验收信息">
          <div class="expectation-item"><span>用户看到</span><strong data-visible></strong></div>
          <div class="expectation-item"><span>用户可以做</span><strong data-action></strong></div>
          <div class="expectation-item"><span>下一状态</span><strong data-next></strong></div>
        </section>

        <section class="preview-panel">
          <div class="preview-toolbar">
            <nav class="page-tabs" aria-label="预览页面" data-page-tabs></nav>
            <div class="preview-meta"><span data-frame-state>正在载入</span><a class="open-page" data-open-page target="_blank" rel="noreferrer">打开原页</a></div>
          </div>
          <iframe class="preview-frame" title="赛事 C 端页面预览" data-preview-frame></iframe>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" role="status" data-toast>当前场景链接已复制</div>

  <script>
    (() => {
      const phases = [
        { id: "unopened", index: "01", label: "未开放", hint: "入口尚未开放" },
        { id: "registration", index: "02", label: "预热报名", hint: "建立参赛资格" },
        { id: "collecting", index: "03", label: "作品征集", hint: "投稿与审核" },
        { id: "review", index: "04", label: "作品评审", hint: "关闭生产动作" },
        { id: "result", index: "05", label: "结果公示", hint: "名次与权益" },
        { id: "ended", index: "06", label: "赛事结束", hint: "领奖与归档" }
      ];

      const common = {
        event: "running", phase: "collecting", auth: "user", registration: "registered",
        submission: "none", interaction: "enabled", ranking: "live", track: "short",
        integration: "pending", work: "public", review: "0", content: "normal",
        board: "heat", list: "ready", comments: "ready", quota: "available",
        view: "mine", sort: "heat", claim: "publicity"
      };

      const scenario = (id, phase, label, description, visible, action, next, params) => ({
        id, phase, label, description, visible, action, next, params: { ...common, ...params }
      });

      const scenarios = [
        scenario("unopened-guest", "unopened", "游客访问", "赛事与报名入口均未开放。", "赛事基础介绍、预计开放时间", "查看介绍与规则", "等待运营开放报名", { event: "upcoming", phase: "upcoming", auth: "guest", registration: "unregistered", submission: "none", interaction: "disabled", ranking: "hidden", work: "private", board: "hidden", claim: "locked" }),
        scenario("unopened-user", "unopened", "登录用户访问", "登录状态不改变赛事开放边界。", "赛事基础介绍、预计开放时间", "查看介绍与规则", "等待运营开放报名", { event: "upcoming", phase: "upcoming", registration: "unregistered", submission: "none", interaction: "disabled", ranking: "hidden", work: "private", board: "hidden", claim: "locked" }),

        scenario("registration-guest", "registration", "游客准备报名", "报名已开放，但受限动作需要先登录。", "报名时间、资格要求、登录提示", "登录后报名", "已登录未报名", { phase: "registration", auth: "guest", registration: "unregistered", interaction: "disabled", ranking: "hidden", work: "private", board: "hidden", claim: "locked" }),
        scenario("registration-ready", "registration", "已登录未报名", "用户满足登录条件，等待确认参赛资格。", "报名入口、参赛规则、赛道说明", "提交报名", "报名成功", { phase: "registration", registration: "unregistered", submission: "none", ranking: "hidden", work: "private", board: "hidden", claim: "locked" }),
        scenario("registration-done", "registration", "已报名", "资格已建立，尚未进入作品征集。", "已报名结果、赛道和开赛时间", "查看规则与准备作品", "作品征集开启", { phase: "registration", submission: "none", ranking: "hidden", work: "private", board: "hidden", claim: "locked" }),

        scenario("collecting-empty", "collecting", "已报名未投稿", "用户可以创建第一件参赛作品。", "投稿入口、剩余额度、作品规格", "投稿作品", "保存草稿或提交审核", { submission: "none", work: "private" }),
        scenario("collecting-draft", "collecting", "已保存草稿", "草稿仍在征集期内，可继续编辑或删除。", "草稿内容、剩余额度、截止时间", "继续投稿或删除草稿", "提交审核", { submission: "draft", work: "private" }),
        scenario("collecting-review", "collecting", "作品审核中", "作品已提交，等待赛事审核。", "审核状态、作品摘要", "查看投稿，暂不可修改", "审核通过或退回", { submission: "submitted", work: "private", review: "1", interaction: "disabled" }),
        scenario("collecting-returned", "collecting", "审核退回", "征集未截止，用户可以修改后重新提交。", "退回原因、修改入口、截止时间", "修改并重新提交", "再次进入审核", { submission: "returned", work: "private", review: "0", interaction: "disabled" }),
        scenario("collecting-public", "collecting", "作品已公开", "审核通过，作品参与发现与榜单。", "公开作品、热度、互动和榜单", "查看作品或继续投稿", "征集结束进入评审", { submission: "v2-edit", work: "public" }),
        scenario("collecting-full", "collecting", "投稿额度已满", "用户已用完投稿额度。", "全部投稿及其状态", "查看作品，不可新增投稿", "等待征集结束", { submission: "v2-edit", work: "public", quota: "full" }),

        scenario("review-submitted", "review", "作品评审中", "征集已结束，生产动作关闭。", "参赛作品、评审状态、预计公布时间", "查看作品，不可投稿或修改", "结果公示", { phase: "review", submission: "submitted", work: "public", review: "1", ranking: "locked", interaction: "enabled", board: "heat", quota: "locked", claim: "locked" }),
        scenario("review-public", "review", "公开作品参与评审", "作品保持公开展示，等待最终结果。", "公开作品、热度和评审提示", "浏览与互动", "结果公示", { phase: "review", submission: "v2-edit", work: "public", ranking: "locked", quota: "locked", claim: "locked" }),

        scenario("result-winner", "result", "本人获奖", "获奖名单已公布，当前处于结果公示期。", "获奖名次、综合分、权益开放时间", "查看获奖名单与本人作品", "公示结束后确认领奖", { phase: "result", submission: "v2-edit", work: "public", ranking: "published-result", board: "result", quota: "locked", claim: "publicity" }),
        scenario("result-normal", "result", "本人未获奖", "结果已公布，用户仍可查看作品和完整名单。", "本人作品、最终名单、综合分", "查看作品与获奖名单", "赛事结束归档", { phase: "result", submission: "v2-edit", work: "public", ranking: "published-result", board: "result", quota: "locked", claim: "none" }),

        scenario("ended-claim", "ended", "获奖待领奖", "赛事已结束，获奖用户可以确认领奖信息。", "最终名次、奖励内容、领奖入口", "确认领奖信息", "权益核验与发放", { event: "ended", phase: "ended", submission: "v2-edit", ranking: "published-result", board: "result", quota: "locked", claim: "available" }),
        scenario("ended-claimed", "ended", "奖励已确认", "赛事和领奖流程均已完成。", "最终名单、发放状态、历史作品", "查看历史作品和领奖记录", "流程归档", { event: "ended", phase: "ended", submission: "v2-edit", ranking: "published-result", board: "result", quota: "locked", claim: "claimed" })
      ];

      const pages = [
        { id: "detail", label: "活动介绍", file: "competition-detail.html" },
        { id: "rules", label: "参赛规则", file: "competition-rules.html" },
        { id: "works", label: "参赛作品", file: "competition-works.html" },
        { id: "mine", label: "我的投稿", file: "competition-my-submissions.html" },
        { id: "ranking", label: "排行榜", file: "competition-ranking.html" },
        { id: "work", label: "作品详情", file: "competition-work.html", extra: { submission_id: "S-001" } }
      ];

      const els = {
        phases: document.querySelector("[data-phase-list]"), scenarios: document.querySelector("[data-scenario-list]"),
        pages: document.querySelector("[data-page-tabs]"), title: document.querySelector("[data-scenario-title]"),
        description: document.querySelector("[data-scenario-description]"), visible: document.querySelector("[data-visible]"),
        action: document.querySelector("[data-action]"), next: document.querySelector("[data-next]"),
        frame: document.querySelector("[data-preview-frame]"), frameState: document.querySelector("[data-frame-state]"),
        open: document.querySelector("[data-open-page]"), toast: document.querySelector("[data-toast]")
      };

      const hashValue = location.hash.slice(1);
      const [hashScenario, hashPage] = hashValue.split("@");
      let activeScenario = scenarios.find(item => item.id === hashScenario) || scenarios[0];
      let activePhase = activeScenario.phase;
      let activePage = pages.find(item => item.id === hashPage) || pages[0];

      function previewUrl() {
        const params = new URLSearchParams({ ...activeScenario.params, ...(activePage.extra || {}) });
        return `./${activePage.file}?${params.toString()}`;
      }

      function setHash() {
        history.replaceState(null, "", `#${activeScenario.id}@${activePage.id}`);
      }

      function renderPhases() {
        els.phases.innerHTML = phases.map(item => `<button class="phase-button${item.id === activePhase ? " is-active" : ""}" type="button" data-phase="${item.id}"><span class="phase-index">${item.index}</span><span class="phase-copy"><strong>${item.label}</strong><span>${item.hint}</span></span></button>`).join("");
      }

      function renderScenarios() {
        els.scenarios.innerHTML = scenarios.filter(item => item.phase === activePhase).map(item => `<button class="scenario-button${item.id === activeScenario.id ? " is-active" : ""}" type="button" role="tab" aria-selected="${item.id === activeScenario.id}" data-scenario="${item.id}">${item.label}</button>`).join("");
      }

      function renderPages() {
        els.pages.innerHTML = pages.map(item => `<button class="page-tab${item.id === activePage.id ? " is-active" : ""}" type="button" data-page="${item.id}">${item.label}</button>`).join("");
      }

      function loadFrame() {
        const url = previewUrl();
        els.frameState.textContent = "正在载入";
        els.frame.src = url;
        els.open.href = url;
      }

      function render(load = true) {
        renderPhases(); renderScenarios(); renderPages();
        els.title.textContent = activeScenario.label;
        els.description.textContent = activeScenario.description;
        els.visible.textContent = activeScenario.visible;
        els.action.textContent = activeScenario.action;
        els.next.textContent = activeScenario.next;
        setHash();
        if (load) loadFrame();
      }

      document.addEventListener("click", event => {
        const phaseButton = event.target.closest("[data-phase]");
        if (phaseButton) {
          activePhase = phaseButton.dataset.phase;
          activeScenario = scenarios.find(item => item.phase === activePhase);
          render();
          return;
        }
        const scenarioButton = event.target.closest("[data-scenario]");
        if (scenarioButton) {
          activeScenario = scenarios.find(item => item.id === scenarioButton.dataset.scenario);
          activePhase = activeScenario.phase;
          render();
          return;
        }
        const pageButton = event.target.closest("[data-page]");
        if (pageButton) {
          activePage = pages.find(item => item.id === pageButton.dataset.page);
          render();
        }
      });

      document.querySelector("[data-refresh]").addEventListener("click", loadFrame);
      document.querySelector("[data-copy]").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(location.href); }
        catch (_) {
          const input = document.createElement("input"); input.value = location.href; document.body.appendChild(input);
          input.select(); document.execCommand("copy"); input.remove();
        }
        els.toast.classList.add("is-visible");
        setTimeout(() => els.toast.classList.remove("is-visible"), 1600);
      });
      els.frame.addEventListener("load", () => { els.frameState.textContent = `${activePage.label}已载入`; });
      window.addEventListener("hashchange", () => location.reload());
      render();
    })();
  </script>
</body>
</html>
