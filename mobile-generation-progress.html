<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>生成中 - 多元拾光</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/duoyuan-shiguang-favicon.svg">
  <link rel="stylesheet" href="./mobile-h5.css?v=20260820-p6">
  <script src="./mobile-h5.js?v=20260820-p6" defer></script>
</head>
<body class="mobile-h5-body" data-mobile-page="generation-progress">
  <div class="mobile-shell" data-mobile-generation-redirect>
    <main id="main" class="mobile-task-content mobile-generation-redirect">
      <img class="mobile-icon" src="resources/icons/remixicon/svg/System/loader-4-line.svg" alt="">
      <h1>正在返回创作页</h1>
      <p>生成状态已合并到图片或视频创作页的任务卡中。</p>
      <a class="mobile-button secondary" href="./mobile-create.html?mode=image&amp;state=running">返回创作页</a>
    </main>
  </div>

  <button class="mobile-walkthrough-trigger" type="button" data-mobile-walkthrough-open aria-controls="mobile-walkthrough">走查</button>
  <aside id="mobile-walkthrough" class="mobile-walkthrough" data-mobile-walkthrough aria-hidden="true">
    <div class="mobile-walkthrough-head"><h2>生成状态兼容入口规则</h2><button class="mobile-icon-button" type="button" data-mobile-walkthrough-close aria-label="关闭走查规则"><img class="mobile-icon" src="resources/icons/remixicon/svg/System/close-line.svg" alt=""></button></div>
    <div class="mobile-rule-grid">
      <section class="mobile-rule-card"><strong>页面目的</strong><p>仅兼容旧生成中地址；读取 mode、state、prompt、model 和 source 后返回对应创作页。</p></section>
      <section class="mobile-rule-card"><strong>当前链路</strong><p>图片/视频创作页内的任务卡承接排队、生成中、成功、失败和状态暂不可确认；成功后点击结果预览进入结果页。</p></section>
      <section class="mobile-rule-card"><strong>验收</strong><p>访问旧地址不会停留在独立生成中页，查询参数完整传递到对应创作页。</p></section>
    </div>
  </aside>
  <div class="mobile-toast" data-mobile-toast role="status" aria-live="polite"></div>
</body>
</html>
