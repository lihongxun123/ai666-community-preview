<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>参赛排行榜 - AIGC 创作挑战赛</title><link rel="icon" type="image/svg+xml" href="assets/brand/duoyuan-shiguang-favicon.svg"><link rel="stylesheet" href="./style.css?v=20260805-c02b"><link rel="stylesheet" href="./competition.css?v=20260813-result-owner-row">
  <link rel="stylesheet" href="./competition-state-gates.css?v=20260814-state-matrix"></head>
<body>
<div class="competition-page" data-page="competition-ranking" data-competition-id="COMP-2026-AIGC-01" data-auth-default="user">
  <header class="competition-header">
    <div class="competition-header-inner">
      <a class="competition-platform-brand" href="./index.html" aria-label="返回多元拾光社区"><img src="assets/brand/duoyuan-shiguang-logo-mark-reverse.svg" alt=""><strong>多元拾光</strong></a>
      <a class="competition-brand" href="./competition-detail.html" data-competition-brand-lockup data-competition-link aria-label="AIGC 创作挑战赛赛事主页"><span class="competition-brand-copy"><strong data-competition-event-name>AIGC 创作挑战赛</strong></span></a>
      <nav class="competition-site-nav" aria-label="赛事导航"><a href="./competition-detail.html" data-competition-link>赛事主页</a><a href="./competition-rules.html" data-competition-link>参赛规则</a><a href="./competition-works.html" data-competition-link>参赛作品</a><a href="./competition-ranking.html" data-competition-link data-competition-ranking-nav class="is-active" aria-current="page">排行榜</a><a href="./competition-my-submissions.html" data-competition-link>我的投稿</a></nav>
      <div class="competition-header-right"><button class="competition-auth competition-auth--guest" type="button" data-competition-login-open>登录</button><div class="competition-auth competition-auth--logged" aria-label="当前登录用户"><img src="assets/image_assets/1.png" alt=""><span data-auth-name title="空镜">空镜</span></div></div>
    </div>
  </header>

  <main class="competition-page-shell competition-subpage">
    <section class="competition-event-notice" data-event-banner hidden role="status"></section>
    <section class="competition-ranking-hero" hidden aria-hidden="true">
      <h1 data-rank-title>热度榜</h1>
    </section>
    <div class="competition-rank-toolbar">
      <div class="competition-rank-tabs" role="tablist" aria-label="榜单类型"><button class="is-active" type="button" role="tab" aria-selected="true" data-rank-tab="heat" data-competition-rank-tab="heat">热度榜</button><button type="button" role="tab" aria-selected="false" data-rank-tab="result" data-competition-rank-tab="result">获奖名单</button></div>
      <label class="competition-ranking-track"><span>当前赛道</span><select data-ranking-track><option value="short">8–30s · 瞬间成境</option><option value="medium">30–90s · 未来来信</option><option value="long">90s+ · 世界之外</option><option value="free">自由创作</option></select></label>
    </div>

    <section class="competition-ranking-state" data-ranking-state hidden></section>
    <section data-ranking-content>
      <div class="competition-rank-podium" data-rank-podium></div>
      <div class="competition-rank-list-head"><span>名次</span><span>创作者</span><span>作品</span><span>赛道</span><span>当前数据</span></div>
      <div class="competition-rank-list" data-rank-list></div>
    </section>

  </main>

  <div class="competition-modal" data-competition-modal="appeal" hidden><section class="competition-modal-card" role="dialog" aria-modal="true" aria-labelledby="appeal-title"><button class="competition-modal-close" type="button" data-competition-modal-close aria-label="关闭"><img src="resources/icons/remixicon/svg/System/close-line.svg" alt=""></button><span class="competition-modal-kicker">结果异议</span><h2 id="appeal-title">提交需要复核的问题</h2><p>仅受理公示期内与本人作品、评委评分或获奖结果有关的问题。赛事助手会在 2 个工作日内通过站内信回复。</p><label class="competition-field"><span>异议类型</span><select data-appeal-type><option value="">请选择</option><option value="result">获奖结果</option><option value="score">评委评分</option><option value="identity">作品或作者信息</option><option value="other">其他赛事结果问题</option></select></label><label class="competition-field"><span>问题说明</span><textarea rows="4" maxlength="500" placeholder="请说明涉及的作品、结果和希望复核的内容" data-appeal-description></textarea></label><p class="competition-inline-message" data-appeal-message aria-live="polite"></p><button class="competition-btn primary full" type="button" data-appeal-confirm>提交异议</button></section></div>
  <div class="competition-modal" data-competition-modal="prize-claim" hidden><section class="competition-modal-card" role="dialog" aria-modal="true" aria-labelledby="claim-modal-title"><button class="competition-modal-close" type="button" data-competition-modal-close aria-label="关闭"><img src="resources/icons/remixicon/svg/System/close-line.svg" alt=""></button><span class="competition-modal-kicker">领奖确认</span><h2 id="claim-modal-title">确认获奖账号与公开署名</h2><p>赛事方将人工核验参赛资格和领奖信息；提交后可在结果页查看核验与发放状态。</p><label class="competition-field"><span>获奖账号</span><input type="text" value="空镜" readonly></label><label class="competition-field"><span>公开署名</span><input type="text" maxlength="30" value="空镜" data-claim-display-name></label><label class="competition-check"><input type="checkbox" data-claim-agreement><span>我确认参赛资格与作品信息真实有效，并同意按现行赛事规则领取获奖权益。</span></label><p class="competition-inline-message" data-claim-message aria-live="polite"></p><button class="competition-btn primary full" type="button" data-claim-confirm>提交领奖信息</button></section></div>
</div>
<script src="./walkthrough.js?v=20260805-c02b"></script><script src="./competition.js?v=20260813-result-owner-row"></script>
<script src="./competition-state-gates.js?v=20260814-state-matrix"></script>
</body>
</html>
